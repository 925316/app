name: Deploy

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup production build dependencies
      uses: ./.github/actions/setup-laravel
      with:
        php-version: '8.3'
        php-extensions: mbstring, dom, fileinfo, pdo_mysql
        composer-cache-key: 'no-dev'
        composer-flags: '--no-progress --prefer-dist --optimize-autoloader --no-dev'
        setup-node: 'true'
        install-npm: 'true'
        build-assets: 'true'

    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: production-files
        path: |
          app/
          bootstrap/
          config/
          database/
          public/
          resources/
          routes/
          storage/
          vendor/
          .env.production.example
          artisan
          composer.json
          composer.lock
          package.json
          package-lock.json
          phpunit.xml
          postcss.config.js
          tailwind.config.js
          vite.config.js

    - name: Deploy to production
      run: |
        echo "Deploy to your production server here"
        echo "This is where you would typically use SSH, rsync, or your deployment tool of choice"
        echo "For example:"
        echo "  ssh user@server 'cd /path/to/app && git pull && composer install --no-dev && npm run build'"
        echo "  or use a deployment service like Laravel Forge, Envoyer, etc."
