name: Code Quality

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ blade ]
  pull_request:
    branches: [ blade ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Laravel project
      uses: ./.github/actions/setup-laravel
      with:
        php-version: '8.3'
        php-extensions: mbstring, dom, fileinfo, pdo_mysql
        composer-cache-key: 'dev'

    - name: Run Laravel Pint
      run: vendor/bin/pint --test

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Laravel project
      uses: ./.github/actions/setup-laravel
      with:
        php-version: '8.3'
        php-extensions: mbstring, dom, fileinfo, pdo_mysql
        composer-cache-key: 'dev'

    - name: Run security check
      run: composer audit
